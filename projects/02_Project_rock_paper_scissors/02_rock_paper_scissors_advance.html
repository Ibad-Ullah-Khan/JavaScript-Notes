<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick="

    pickComputerMove()
    let result = '';

    if (computerMove === 'rock'){
        result = 'Tie';
    }else if (computerMove === 'paper'){
        result = 'You Lose';
    }else if (computerMove === 'scissors'){
        result = 'You Win';
    }

    alert(`Your Picked rock, Computer Picked ${computerMove}, ${result}`);

    ">Rock</button>

    <button onclick="

    pickComputerMove()
    result = '';

    if (computerMove === 'paper'){
        result = 'Tie';
    }else if (computerMove === 'scissors'){
        result = 'You Lose';
    }else if (computerMove === 'rock'){
        result = 'You Win';
    }

    alert(`Your Picked paper, Computer Picked ${computerMove}, ${result}`);

    ">Paper</button>
    <button onclick="
    
    pickComputerMove()
    result = '';

    if (computerMove === 'scissors'){
        result = 'Tie';
    }else if (computerMove === 'rock'){
        result = 'You Lose';
    }else if (computerMove === 'paper'){
        result = 'You Win';
    }

    alert(`Your Picked scissors, Computer Picked ${computerMove}, ${result}`);

    ">Scissors</button>

    <script>

        let computerMove = '';
        function pickComputerMove(){
                const randomNum = Math.random();

                if (randomNum >= 0 && randomNum < 1/3){
                    computerMove = 'rock';
                }else if (randomNum >= 1/3 && randomNum < 2/3){
                    computerMove = 'paper';
                }else if (randomNum >= 2/3 && randomNum < 1){
                    computerMove = 'scissors';
                }
        }
    </script>
</body>
</html>
