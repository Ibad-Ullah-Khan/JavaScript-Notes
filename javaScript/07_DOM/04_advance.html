<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="helloBtn">Hello</button>
    <button class="js_button">Second Button</button>

    <script>
        // If we have two buttons we can acess it through class attributes
        console.log(document.querySelector('.js_button'))

        // We know that html element inside javascript is object and we can store object in variable

        const buttonElement = document.querySelector('.js_button')
        console.log(buttonElement)

        // we can also get the elements by it ids or it class names here is how can we do that 
        const helloBtn = document.getElementsByClassName("helloBtn");
    </script>
</body>
</html>
